services:
  db:
    image: pgvector/pgvector:pg16
    container_name: novel-rag-db
    environment:
      POSTGRES_DB: ai_novel
      POSTGRES_USER: ai_novel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports:
      - "5432:5432"
    volumes:
      - novel_rag_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_novel -d ai_novel"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  novel_rag_data:
